spring:
  application:
    name: voice-dev-bot
  config:
    import: optional:file:.env[.properties]

bot:
  token: ${TELEGRAM_BOT_TOKEN:}
  allowed-user-ids: ${TELEGRAM_ALLOWED_USER_IDS:}
  api-url: ${BOT_API_URL:https://api.telegram.org}
  polling-enabled: ${BOT_POLLING_ENABLED:true}

stt:
  engine: ${STT_ENGINE:whisper-cpp}
  whisper:
    url: ${STT_WHISPER_URL:http://127.0.0.1:8178}
    language: ${STT_WHISPER_LANGUAGE:uz}
    # Whisper o'zbekchada goh kirill, goh turkcha imloga o'tib ketadi — lotin namunasi buni barqarorlashtiradi
    prompt: ${STT_WHISPER_PROMPT:Assalomu alaykum. Bu matn o'zbek tilida, lotin yozuvida yozilgan.}
    timeout: ${STT_WHISPER_TIMEOUT:15m}
